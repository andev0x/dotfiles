# =============================================================================
# TMUX CONFIG — ULTIMATE REFINED MINIMAL
# Author: andev0x
# Philosophy:
# - Ultra-clean transparent typography on the flanks
# - High-contrast visual focus on active center capsules
# - Dimmed out inactive nodes for zero workflow distraction
# - Low-profile compact spacing optimized for Ghostty
# =============================================================================

# ==========================================
# 1. GENERAL SETTINGS
# ==========================================

set -g mouse on

# Instant escape response time optimized for Neovim modal responsiveness
set -sg escape-time 1

# Prevent aggressive status bar redraws to reduce I/O overhead during AI streaming
set -g status-interval 10

# High capacity scrollback history buffer
set -g history-limit 50000

# Start window and pane indices at 1 for natural keyboard ergonomic reach
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Optimized event processing and system integration
set -g focus-events on
set -g set-clipboard on
set -g display-time 1500

# Terminal capabilities and modern true color (RGB) support
set -g default-terminal "tmux-256color"
set -sa terminal-features ",*:RGB"

# Enable extended CSI-u keyboard protocol for advanced Neovim bindings
set -g extended-keys on
set -g extended-keys-format csi-u

# Force Vi motions inside text copy mode
setw -g mode-keys vi

# Context-aware automatic window naming based on process or active path
setw -g automatic-rename on
setw -g automatic-rename-format '#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command}}'

# ==========================================
# 2. COLOR PALETTE (PREMIUM DARK FOREST)
# ==========================================

# Transparent background to fully inherit Ghostty's compositing blur layer
bg="default"
surface="#111815"
surface_alt="#161f1b"

# High-contrast readable foregrounds
fg="#d7e3dc"
muted="#4a5550"       # Significantly dimmed down for subtle inactive tabs
telemetry="#66706b"   # Kept slightly higher for system utility legibility
subtle="#7d8b86"

# Strategic accent markers
green="#8fbf87"
blue="#7a8fa3"
orange="#d8a46b"

# Structural boundaries
border="#1a2621"

# Solid deep background fallback for high-readability overlay UI popups
bg_solid="#0b1410"

# ==========================================
# 3. KEYBINDINGS & NAVIGATIONS
# ==========================================

# Ergonomic Prefix configuration (Ctrl+a)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Unified smart pane navigation using standard Meta/Alt keys 
# This bypasses native Neovim maps and guarantees zero navigation conflicts
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Quick multi-window navigation
bind -r C-h previous-window
bind -r C-l next-window

# Continuous incremental pane resizing
bind -r Left resize-pane -L 5
bind -r Right resize-pane -R 5
bind -r Up resize-pane -U 3
bind -r Down resize-pane -D 3

# Toggle layout zoom maximization
bind z resize-pane -Z

# Directory-aware structural layout splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Hot-reload configuration with instant overlay indicator
bind r source-file ~/.config/tmux/tmux.conf \; display-message "✔ Config reloaded successfully"

# Safe destruction multi-step confirmation prompts
bind x confirm-before -p "Kill active pane? (y/n)" kill-pane
bind X confirm-before -p "Kill active window? (y/n)" kill-window
bind Q confirm-before -p "Kill active session? (y/n)" kill-session

# Manual Git cache flush
bind u run-shell "~/.config/tmux/scripts/git-update.sh '#{pane_current_path}'"

# ==========================================
# 4. POPUP INTEGRATIONS (FLOATING UI)
# ==========================================

# Floating context shell popup overlay
bind p display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "$SHELL"

# Persistent background scratchpad overlay session
bind P display-popup -E -w 80% -h 80% -d "#{pane_current_path}" \
  "tmux new-session -A -s scratch"

# Lazygit TUI dashboard popup overlay
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
  "sh -c 'command -v lazygit >/dev/null && lazygit || (echo \"lazygit not installed\"; read); ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\"'"

# Yazi terminal file manager popup overlay
bind y display-popup -E -w 90% -h 90% -d "#{pane_current_path}" \
  "sh -c 'command -v yazi >/dev/null && yazi || (echo \"yazi not installed\"; read); ~/.config/tmux/scripts/git-update.sh \"#{pane_current_path}\"'"

# ==========================================
# 5. STATUS BAR (REFINED TYPOGRAPHY DESIGN)
# ==========================================

set -g status-position bottom
set -g status-justify centre
set -g status-style "bg=${bg},fg=${muted}"

# ------------------------------------------
# LEFT: CLEAN TRANSPARENT SESSION TEXT
# ------------------------------------------
set -g status-left-length 40
set -g status-left "#[fg=${green},bg=${bg},bold] #S"

# ------------------------------------------
# CENTER: WINDOWS MANAGER CAPSULES
# ------------------------------------------
setw -g window-status-separator "  "

# Inactive structural tabs (Dimmed for high-contrast active isolation)
setw -g window-status-format "#[fg=${muted},bg=${bg}]#I·#{=12:window_name}"

# Active premium capsule tab with balanced symmetric paddings
setw -g window-status-current-format "\
#[fg=${surface_alt},bg=${bg}]\
#[fg=${orange},bg=${surface_alt},bold]#I \
#[fg=${fg},bg=${surface_alt}]#{=14:window_name} \
#[fg=${surface_alt},bg=${bg}]"

# ------------------------------------------
# RIGHT: TELEMETRY & SYSTEM GRAPH
# ------------------------------------------
set -g status-right-length 150
set -g status-right "\
#[fg=${blue},bg=${bg}]#(~/.config/tmux/scripts/git-read.sh \"#{pane_current_path}\") #[fg=${muted}]• \
#[fg=${telemetry},bg=${bg}]󰍛 #(~/.config/tmux/scripts/cpu.sh) #[fg=${muted}]• \
#[fg=${subtle},bg=${bg}]#{user}@#{host_short} #[fg=${muted}]• \
#[fg=${green},bg=${bg},bold] %H:%M "

# ==========================================
# 6. PANE VISUALS & CONTEXT COLORS
# ==========================================

# Window border lines bound strictly to background layer
set -g pane-border-style "fg=${border},bg=${bg}"
set -g pane-active-border-style "fg=${green},bg=${bg}"

# Command line notification messages layout overlay
set -g message-style "fg=${bg_solid},bg=${green},bold"

# Vi Copy mode highlighting color contrast layer
set -g mode-style "fg=${bg_solid},bg=${blue}"

# ==========================================
# 7. COPY MODE & MODERN CLIPBOARD BRIDGE
# ==========================================

# Traditional character block selection binding
bind-key -T copy-mode-vi v send-keys -X begin-selection

# Native cross-platform system clipboard sync (Leveraging OSC 52 inside Ghostty)
# Falls back gracefully to system clipboard utilities if OSC 52 is blocked
if-shell 'command -v pbcopy >/dev/null 2>&1' \
  'bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"' \
  'if-shell "command -v wl-copy >/dev/null 2>&1" \
    "bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \"wl-copy\"" \
    "if-shell \"command -v xclip >/dev/null 2>&1\" \
      \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel \\\"xclip -selection clipboard\\\"\" \
      \"bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel\""'

# ==========================================
# 8. PLUGIN ARCHITECTURE (TPM)
# ==========================================

# Core Tmux Plugin Manager anchor initialization
set -g @plugin 'tmux-plugins/tpm'

# State retention management infrastructure
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Seamless structural movement core utility
set -g @plugin 'christoomey/vim-tmux-navigator'

# Background automatic continuous backup checkpoints configuration
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

# Boot up the plugin manager layer
run '~/.tmux/plugins/tpm/tpm'
